doctrine:
    dbal:
        connections:
            default:
                # Every test runs inside a transaction that is rolled back afterwards, and a test
                # that opens one of its own needs a savepoint rather than a second transaction.
                use_savepoints: true

framework:
    messenger:
        # A test that commits would leave its messages in the database, and every later run would work them off.
        transports:
            opendxp_core: 'in-memory://'
            opendxp_maintenance: 'in-memory://'
            opendxp_scheduled_tasks: 'in-memory://'
            opendxp_image_optimize: 'in-memory://'
            opendxp_asset_update: 'in-memory://'

services:
    OpenDxp\TestFoundation\Controller\DefaultController:
        autowire: true
        autoconfigure: true

opendxp:
    security:
        password:
            # Every user a factory writes gets a password, and a secure hash only slows the tests down.
            options:
                cost: 4

    documents:
        default_controller: 'OpenDxp\TestFoundation\Controller\DefaultController::defaultAction'

    email:
        debug:
            # Tests run in debug mode, where OpenDXP sends every mail to this address instead of its recipients.
            email_addresses: 'debug@test-foundation.test'

    config_location:
        image_thumbnails:
            write_target: { type: 'settings-store' }
        video_thumbnails:
            write_target: { type: 'settings-store' }
        document_types:
            write_target: { type: 'settings-store' }
        predefined_properties:
            write_target: { type: 'settings-store' }
        predefined_asset_metadata:
            write_target: { type: 'settings-store' }
        perspectives:
            write_target: { type: 'settings-store' }
        custom_views:
            write_target: { type: 'settings-store' }
        object_custom_layouts:
            write_target: { type: 'settings-store' }
        system_settings:
            write_target: { type: 'settings-store' }
        select_options:
            write_target: { type: 'settings-store' }

playwright:
    assets:
        # A real browser asks for the images and scripts a page references. OpenDXP serves those of
        # its bundles under /bundles, which is not among the prefixes the package assumes, so they
        # would go through the router and answer with a 404.
        prefixes: ['/assets', '/build', '/bundles', '/_framework/ux']

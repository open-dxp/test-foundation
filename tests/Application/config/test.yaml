        class: Symfony\Component\Filesystem\Filesystem
        tags: ['opendxp.test_api']

    OpenDxp\TestFoundation\Tests\Application\Controller\PageController:
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']

twig:
    paths:
        '%kernel.project_dir%/tests/Application/templates': ~
